services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opendoor #mock user for local development
      POSTGRES_PASSWORD: opendoor #mock password for local development
      POSTGRES_DB: opendoor #mock database for local development
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: